<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Token — Fortnite Competitive</title>

<style>
:root{
  --bg:#05070a;
  --bg2:#080d14;
  --panel:#0d131d;
  --panel2:#121a26;
  --panel3:#182232;
  --line:rgba(0,229,255,.12);
  --line2:rgba(0,229,255,.25);

  --text:#f5f7fa;
  --muted:#8994a1;
  --muted2:#5e6976;

  --green:#00ff88;
  --green2:#00cc66;
  --cyan:#00e5ff;
  --blue:#3b82f6;
  --red:#ff4757;
  --yellow:#ffd66b;

  --shadow:0 20px 50px rgba(0,0,0,.6);
  --glow-green:0 0 20px rgba(0,255,136,.25);
  --glow-cyan:0 0 20px rgba(0,229,255,.25);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  transition:background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .15s ease;
}

html{ scroll-behavior:smooth; }

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 0%, rgba(0,229,255,.12), transparent 35%),
    radial-gradient(circle at 85% 10%, rgba(0,255,136,.10), transparent 30%),
    linear-gradient(180deg, var(--bg), var(--bg2));
  color:var(--text);
  font-family:Inter,Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

button,input,select{ font:inherit; }

button{ cursor:pointer; user-select:none; }

button:active{ transform:scale(.97) !important; }

*{
  scrollbar-width:thin;
  scrollbar-color:#1e293b transparent;
}

::-webkit-scrollbar{ width:6px; }
::-webkit-scrollbar-thumb{ background:#1e293b; border-radius:10px; }

/* =========================
   APP & SIDEBAR
========================= */

.app{ min-height:100vh; }

.sidebar{
  position:fixed;
  z-index:50;
  left:0;
  top:0;
  bottom:0;
  width:245px;
  padding:20px 14px;
  background:linear-gradient(180deg, rgba(8,13,20,.95) 0%, rgba(5,7,10,.98) 100%);
  backdrop-filter:blur(12px);
  border-right:1px solid var(--line);
}

.brand{
  height:58px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:0 10px 17px;
  border-bottom:1px solid var(--line);
  margin-bottom:18px;
}

.brand-mark{
  width:38px;
  height:38px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:1000;
  color:#040906;
  background:linear-gradient(135deg, var(--green), var(--cyan));
  box-shadow:var(--glow-green);
}

.brand-text{
  font-size:16px;
  font-weight:950;
  letter-spacing:-.5px;
  color:#fff;
}

.brand-text span{
  color:var(--green);
  text-shadow:0 0 10px rgba(0,255,136,.4);
}

.nav-label{
  color:var(--muted2);
  font-size:9px;
  font-weight:900;
  letter-spacing:1.6px;
  text-transform:uppercase;
  padding:0 12px 9px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.nav button{
  position:relative;
  border:1px solid transparent;
  width:100%;
  height:44px;
  padding:0 13px;
  display:flex;
  align-items:center;
  gap:12px;
  border-radius:10px;
  background:transparent;
  color:#818c99;
  font-size:12px;
  font-weight:750;
  text-align:left;
}

.nav button:hover{
  color:#fff;
  background:rgba(255,255,255,.04);
  border-color:rgba(255,255,255,.08);
  transform:translateX(3px);
}

.nav button.active{
  color:#fff;
  background:linear-gradient(90deg, rgba(0,255,136,.15), rgba(0,229,255,.05));
  border-color:rgba(0,255,136,.3);
  box-shadow:inset 3px 0 0 var(--green), var(--glow-green);
}

.nav-icon{
  width:21px;
  height:21px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#697583;
  font-size:14px;
}

.nav button.active .nav-icon{ color:var(--green); }

.sidebar-bottom{
  position:absolute;
  left:14px;
  right:14px;
  bottom:18px;
}

.profile-mini{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:12px;
}

.avatar{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:9px;
  color:#040906;
  background:linear-gradient(135deg,var(--green),var(--cyan));
  font-weight:950;
  font-size:12px;
  box-shadow:var(--glow-green);
}

.profile-mini strong{ display:block; font-size:12px; color:#fff; }
.profile-mini span{ display:block; color:var(--muted2); font-size:9px; margin-top:2px; }

/* =========================
   MAIN & TOPBAR
========================= */

.main{
  margin-left:245px;
  min-height:100vh;
}

.topbar{
  position:sticky;
  z-index:40;
  top:0;
  height:70px;
  padding:0 32px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  background:rgba(5,7,10,.82);
  backdrop-filter:blur(16px);
}

.page-title{
  color:#687483;
  font-size:12px;
  font-weight:650;
  text-transform:uppercase;
  letter-spacing:1px;
}

.page-title strong{ color:#fff; text-shadow:0 0 10px rgba(255,255,255,.2); }

.top-actions{
  display:flex;
  align-items:center;
  gap:12px;
}

.profile-chip{
  display:flex;
  align-items:center;
  gap:10px;
  height:46px;
  padding:5px 14px 5px 5px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel2);
  color:#fff;
  text-align:left;
}

.profile-chip:hover{
  border-color:var(--cyan);
  background:var(--panel3);
  box-shadow:var(--glow-cyan);
  transform:translateY(-2px);
}

.profile-chip-avatar{
  width:36px;
  height:36px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:9px;
  color:#040906;
  background:linear-gradient(135deg,var(--green),var(--cyan));
  font-weight:950;
  font-size:12px;
  box-shadow:var(--glow-green);
}

.profile-chip-info{
  display:flex;
  flex-direction:column;
  gap:3px;
  line-height:1;
}

.profile-chip-info strong{
  font-size:12px;
  font-weight:800;
}

.profile-chip-info span{
  font-size:10px;
  color:var(--muted);
}

.profile-chip-info span b{
  color:var(--green);
  font-weight:800;
}

.profile-chip-info span i{
  color:var(--red);
  font-style:normal;
  font-weight:800;
}

.content{
  width:100%;
  max-width:1500px;
  margin:auto;
  padding:30px;
}

/* =========================
   BUTTONS
========================= */

.btn{
  min-height:40px;
  padding:0 18px;
  border:1px solid var(--line2);
  border-radius:10px;
  background:var(--panel2);
  color:#fff;
  font-size:11px;
  font-weight:850;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.btn:hover{
  transform:translateY(-2px);
  border-color:var(--cyan);
  background:var(--panel3);
  box-shadow:var(--glow-cyan);
}

.btn.green{
  color:#040906;
  border:0;
  background:linear-gradient(135deg,var(--green),var(--green2));
  box-shadow:var(--glow-green);
}

.btn.green:hover{
  transform:translateY(-2px);
  box-shadow:0 0 25px rgba(0,255,136,.5);
}

.btn.danger{
  color:var(--red);
  background:rgba(255,71,87,.08);
  border-color:rgba(255,71,87,.25);
}

.btn.danger:hover{
  background:rgba(255,71,87,.18);
  box-shadow:0 0 15px rgba(255,71,87,.3);
}

.btn.small{ min-height:32px; padding:0 12px; font-size:10px; }

/* =========================
   HERO & PANELS
========================= */

.hero{
  position:relative;
  min-height:380px;
  overflow:hidden;
  padding:45px;
  display:flex;
  align-items:center;
  border:1px solid var(--line);
  border-radius:16px;
  background:linear-gradient(135deg, rgba(13,19,29,.9) 0%, rgba(8,13,20,.95) 100%);
  box-shadow:var(--shadow);
}

.hero:before{
  content:"";
  position:absolute;
  width:500px;
  height:500px;
  right:-100px;
  top:-100px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(0,229,255,.15), rgba(0,255,136,.05) 40%, transparent 70%);
}

.hero-grid{
  position:absolute;
  inset:0;
  opacity:.12;
  background-image:linear-gradient(var(--line) 1px,transparent 1px), linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:30px 30px;
}

.hero-content{ position:relative; z-index:3; max-width:650px; }

.eyebrow{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--cyan);
  font-size:10px;
  font-weight:950;
  text-transform:uppercase;
  letter-spacing:2px;
  margin-bottom:15px;
}

.eyebrow i{ width:20px; height:2px; background:linear-gradient(90deg,var(--cyan),var(--green)); }

.hero h1{
  font-size:52px;
  line-height:.95;
  letter-spacing:-2px;
  font-weight:1000;
  color:#fff;
}

.hero h1 span{
  background:linear-gradient(90deg,var(--green),var(--cyan));
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  max-width:520px;
  margin:18px 0 22px;
  color:#94a3b8;
  font-size:13px;
  line-height:1.6;
}

.hero-actions{ display:flex; gap:12px; }

.hero-side{
  position:absolute;
  right:45px;
  top:45px;
  bottom:45px;
  width:300px;
  z-index:3;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:12px;
}

.hero-card{
  border:1px solid var(--line);
  background:rgba(8,13,20,.8);
  backdrop-filter:blur(10px);
  padding:16px;
  border-radius:12px;
}

.hero-card-label{
  color:var(--muted);
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1px;
}

.hero-card-value{
  margin-top:6px;
  font-size:22px;
  font-weight:950;
  color:#fff;
}

.hero-card-value span{ color:var(--green); }

.hero-card-row{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.05);
  font-size:11px;
}

.hero-card-row:last-child{ border-bottom:0; }
.hero-card-row span{ color:var(--muted); }
.hero-card-row strong{ color:#fff; }

.home-grid{
  display:grid;
  grid-template-columns:1.35fr .9fr;
  gap:18px;
  margin-top:20px;
}

.panel{
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:14px;
  overflow:hidden;
}

.panel-head{
  min-height:54px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.02);
}

.panel-head h3{ font-size:13px; color:#fff; }
.panel-head span{ color:var(--muted2); font-size:9px; font-weight:900; letter-spacing:1px; }

.panel-body{ padding:16px; }

.quick-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.quick-stat{
  padding:15px;
  border:1px solid var(--line);
  background:var(--panel2);
  border-radius:10px;
}

.quick-stat span{ color:var(--muted); font-size:9px; text-transform:uppercase; letter-spacing:1px; font-weight:800; }
.quick-stat strong{ display:block; margin-top:6px; font-size:22px; color:#fff; }

/* =========================
   CHAT
========================= */

.chat-box{ height:300px; display:flex; flex-direction:column; }
.chat-messages{ flex:1; overflow:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
.chat-message{ display:flex; gap:10px; }
.chat-avatar{ width:28px; height:28px; flex:none; display:flex; align-items:center; justify-content:center; border-radius:7px; background:var(--panel3); border:1px solid var(--line); color:var(--green); font-size:9px; font-weight:900; }
.chat-meta{ display:flex; gap:8px; align-items:center; }
.chat-meta strong{ font-size:11px; color:#fff; }
.chat-meta span{ color:var(--muted2); font-size:9px; }
.chat-content p{ color:#cbd5e1; margin-top:3px; font-size:11px; line-height:1.4; }
.chat-form{ padding:12px; display:flex; gap:8px; border-top:1px solid var(--line); background:rgba(0,0,0,.2); }
.chat-form input{ flex:1; min-width:0; height:38px; padding:0 12px; border:1px solid var(--line); border-radius:8px; outline:0; background:var(--bg); color:#fff; font-size:11px; }

/* =========================
   MATCHES
========================= */

.matches-header{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:20px; }
.matches-header h1{ font-size:26px; letter-spacing:-1px; color:#fff; }
.matches-header p{ color:var(--muted); margin-top:4px; font-size:11px; }

.matches-list{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }

.match-card{ border:1px solid var(--line); border-radius:12px; background:var(--panel); overflow:hidden; }
.match-card:hover{ transform:translateY(-3px); border-color:var(--green); box-shadow:var(--glow-green); }

.match-top{ min-height:64px; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); background:linear-gradient(90deg, rgba(0,255,136,.05), transparent); }
.match-game{ display:flex; align-items:center; gap:12px; }
.game-icon{ width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--green); font-weight:950; font-size:11px; }
.match-game strong{ display:block; font-size:12px; color:#fff; }
.match-game span{ display:block; margin-top:2px; color:var(--muted); font-size:9px; }

.status{ padding:5px 8px; border-radius:6px; font-size:8px; font-weight:950; letter-spacing:1px; text-transform:uppercase; }
.status.open{ color:var(--green); background:rgba(0,255,136,.1); border:1px solid rgba(0,255,136,.2); }
.status.private{ color:var(--yellow); background:rgba(255,214,107,.1); border:1px solid rgba(255,214,107,.2); }

.match-body{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:14px; }
.match-info span{ display:block; margin-bottom:4px; color:var(--muted2); font-size:8px; font-weight:850; letter-spacing:.8px; text-transform:uppercase; }
.match-info strong{ color:#e2e8f0; font-size:10px; }

.match-footer{ padding:10px 14px; display:flex; align-items:center; justify-content:space-between; border-top:1px solid var(--line); background:rgba(0,0,0,.15); }
.match-footer small{ color:var(--muted2); font-size:9px; }

/* =========================
   MODALS
========================= */

.overlay{ position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(2,4,7,.85); backdrop-filter:blur(12px); }
.overlay.open{ display:flex; animation:fadeIn .2s ease; }

@keyframes fadeIn{ from{opacity:0} to{opacity:1} }

.modal{ width:min(680px,100%); max-height:90vh; overflow:auto; border:1px solid var(--line2); border-radius:16px; background:var(--panel); box-shadow:0 30px 100px rgba(0,0,0,.8); }

.modal-head{ min-height:65px; padding:0 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
.modal-head h2{ font-size:16px; color:#fff; }
.modal-head p{ color:var(--muted); margin-top:2px; font-size:10px; }

.close{ width:32px; height:32px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); color:var(--muted); font-size:18px; display:flex; align-items:center; justify-content:center; }
.close:hover{ color:#fff; border-color:var(--red); background:rgba(255,71,87,.1); }

.modal-body{ padding:20px; }

.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.form-group{ display:flex; flex-direction:column; gap:6px; }
.form-group.full{ grid-column:1/-1; }
.form-group label{ color:var(--muted); font-size:9px; font-weight:900; text-transform:uppercase; letter-spacing:1px; }

.input, .select{ width:100%; height:40px; padding:0 12px; border:1px solid var(--line); border-radius:8px; outline:0; background:var(--bg); color:#fff; font-size:11px; }
.select option{ background:var(--panel); color:#fff; }

.segment{ display:grid; grid-template-columns:repeat(2,1fr); gap:4px; padding:4px; border:1px solid var(--line); border-radius:8px; background:var(--bg); }
.segment.four{ grid-template-columns:repeat(4,1fr); }
.segment.five{ grid-template-columns:repeat(5,1fr); }

.segment button{ height:32px; border:0; border-radius:6px; background:transparent; color:var(--muted); font-size:10px; font-weight:850; }
.segment button.active{ color:#040906; background:linear-gradient(135deg,var(--green),var(--cyan)); font-weight:900; box-shadow:var(--glow-green); }

.toggle-line{ min-height:54px; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
.toggle-text strong{ display:block; font-size:11px; color:#fff; }
.toggle-text span{ display:block; color:var(--muted2); margin-top:2px; font-size:9px; }

.switch{ width:42px; height:24px; padding:2px; border:1px solid var(--line); border-radius:20px; background:var(--panel2); }
.switch span{ display:block; width:18px; height:18px; border-radius:50%; background:var(--muted); transition:transform .2s ease, background-color .2s ease; }
.switch.active{ background:rgba(0,255,136,.2); border-color:var(--green); }
.switch.active span{ transform:translateX(18px); background:var(--green); box-shadow:var(--glow-green); }

.kill-wrap, .private-code-wrap{ display:none; }
.kill-wrap.visible, .private-code-wrap.visible{ display:flex; }

.modal-footer{ display:flex; justify-content:flex-end; gap:10px; padding:16px 20px; border-top:1px solid var(--line); background:rgba(0,0,0,.15); }

/* =========================
   LOBBY
========================= */

.lobby-layout{ display:grid; grid-template-columns:1fr 320px; gap:18px; }
.lobby-main{ border:1px solid var(--line); border-radius:14px; background:var(--panel); overflow:hidden; }

.lobby-header{ min-height:70px; padding:0 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); background:rgba(255,255,255,.02); }
.lobby-title strong{ display:block; font-size:16px; color:#fff; }
.lobby-title span{ display:block; margin-top:3px; color:var(--muted); font-size:10px; }

.lobby-code span{ display:block; color:var(--muted2); font-size:8px; letter-spacing:1px; text-transform:uppercase; }
.lobby-code strong{ color:var(--green); font-size:16px; letter-spacing:2px; text-shadow:0 0 10px rgba(0,255,136,.3); }

.teams{ display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:18px; }
.team{ border:1px solid var(--line); border-radius:10px; background:var(--bg); overflow:hidden; }
.team-head{ padding:10px 14px; border-bottom:1px solid var(--line); color:var(--muted); font-size:10px; font-weight:900; text-transform:uppercase; background:rgba(255,255,255,.02); }
.team-slots{ padding:10px; display:flex; flex-direction:column; gap:8px; }

.slot{ min-height:50px; padding:10px 12px; display:flex; align-items:center; gap:10px; border:1px dashed var(--line); border-radius:8px; background:var(--panel); }
.slot.empty-slot{ color:var(--muted2); font-size:10px; justify-content:center; }

.slot-name{ font-size:11px; font-weight:800; color:#fff; }
.slot-epic{ color:var(--muted); margin-top:2px; font-size:9px; }

.lobby-actions{ padding:16px; display:flex; justify-content:space-between; border-top:1px solid var(--line); background:rgba(0,0,0,.15); }

/* =========================
   ROUE & TABLES
========================= */

.profile-grid, .settings-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.profile-card, .setting-card, .ranking-table{ border:1px solid var(--line); border-radius:14px; background:var(--panel); overflow:hidden; }
.profile-card{ padding:22px; }

.profile-main{ display:flex; align-items:center; gap:14px; }
.profile-big-avatar{ width:64px; height:64px; display:flex; align-items:center; justify-content:center; border-radius:14px; color:#040906; background:linear-gradient(135deg,var(--green),var(--cyan)); font-weight:1000; font-size:20px; box-shadow:var(--glow-green); }
.profile-main strong{ font-size:18px; color:#fff; }
.profile-main span{ display:block; margin-top:3px; color:var(--muted); font-size:10px; }

.profile-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:20px; }
.profile-stat{ padding:14px; border:1px solid var(--line); border-radius:10px; background:var(--panel2); }
.profile-stat span{ color:var(--muted); font-size:9px; text-transform:uppercase; font-weight:800; }
.profile-stat strong{ display:block; margin-top:6px; font-size:20px; color:#fff; }

.ranking-row{ min-height:52px; padding:0 18px; display:grid; grid-template-columns:50px 1fr 100px 100px; align-items:center; border-bottom:1px solid var(--line); }
.ranking-row.head{ min-height:40px; color:var(--muted2); font-size:9px; font-weight:900; text-transform:uppercase; background:rgba(255,255,255,.02); }

.empty{ min-height:180px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; border:1px dashed var(--line); border-radius:12px; background:var(--panel); }
.empty strong{ font-size:13px; color:#fff; }
.empty span{ color:var(--muted2); font-size:10px; }

/* =========================
   TOAST
========================= */

.toast{ position:fixed; z-index:200; right:25px; bottom:25px; max-width:340px; padding:14px 18px; border:1px solid var(--green); border-radius:10px; background:var(--panel2); color:#fff; box-shadow:var(--shadow), var(--glow-green); font-size:11px; font-weight:800; opacity:0; transform:translateY(10px); pointer-events:none; transition:all .2s ease; }
.toast.show{ opacity:1; transform:none; }

@media(max-width:1000px){
  .sidebar{ width:210px; }
  .main{ margin-left:210px; }
  .hero-side{ display:none; }
  .home-grid, .lobby-layout{ grid-template-columns:1fr; }
  .matches-list{ grid-template-columns:1fr; }
}

@media(max-width:760px){
  .sidebar{ position:relative; width:100%; padding:12px; }
  .nav{ display:grid; grid-template-columns:repeat(4,1fr); gap:4px; }
  .nav button{ justify-content:center; padding:0 4px; font-size:10px; }
  .nav-icon, .sidebar-bottom{ display:none; }
  .main{ margin-left:0; }
  .topbar{ padding:0 16px; }
  .content{ padding:16px; }
  .hero{ padding:25px; min-height:auto; }
  .hero h1{ font-size:36px; }
  .quick-stats, .profile-grid, .settings-grid, .form-grid, .teams{ grid-template-columns:1fr; }
  .match-body{ grid-template-columns:repeat(2,1fr); }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

  <div class="brand">
    <div class="brand-mark">P</div>
    <div class="brand-text">PRIME <span>TOKEN</span></div>
  </div>

  <div class="nav-label">Platform</div>

  <nav class="nav">
    <button data-page="home" class="active"><span class="nav-icon">⌂</span> Accueil</button>
    <button data-page="matches"><span class="nav-icon">◈</span> Matchs</button>
    <button data-page="lobby"><span class="nav-icon">▦</span> Lobby</button>
    <button data-page="roue"><span class="nav-icon">🎡</span> Roue</button>
    <button data-page="profile"><span class="nav-icon">◎</span> Profil</button>
    <button data-page="ranking"><span class="nav-icon">♜</span> Classement</button>
    <button data-page="tournaments"><span class="nav-icon">♛</span> Tournois</button>
    <button data-page="settings"><span class="nav-icon">⚙</span> Paramètres</button>
  </nav>

  <div class="sidebar-bottom">
    <div class="profile-mini">
      <div class="avatar" id="miniAvatar">P</div>
      <div>
        <strong id="miniUsername">Player</strong>
        <span>Fortnite</span>
      </div>
    </div>
  </div>

</aside>

<main class="main">

<header class="topbar">
  <div class="page-title">
    PRIME TOKEN / <strong id="pageName">Accueil</strong>
  </div>
  <div class="top-actions">
    <button class="btn green" onclick="openCreateModal()">+ Créer un match</button>
    <button class="profile-chip" onclick="setPage('profile')" title="Voir mon profil">
      <div class="profile-chip-avatar" id="topAvatar">P</div>
      <div class="profile-chip-info">
        <strong id="topUsername">Player</strong>
        <span id="topRecord"><b>0V</b> · <i>0D</i> · 0%</span>
      </div>
    </button>
  </div>
</header>

<div class="content" id="content"></div>

</main>

</div>


<!-- =========================
     CREATE MODAL
========================= -->

<div class="overlay" id="createOverlay">
<div class="modal">

  <div class="modal-head">
    <div>
      <h2>Créer un match</h2>
      <p>Configure ton match Fortnite.</p>
    </div>
    <button class="close" onclick="closeCreateModal()">×</button>
  </div>

  <div class="modal-body">
    <div class="form-grid">

      <div class="form-group full">
        <label>Visibilité</label>
        <div class="segment">
          <button id="publicBtn" class="active" onclick="setVisibility('public')">Public</button>
          <button id="privateBtn" onclick="setVisibility('private')">Privé</button>
        </div>
      </div>

      <div class="form-group full private-code-wrap" id="privateCodeWrap">
        <label>Code d'accès du match privé</label>
        <input type="text" class="input" id="createMatchPasscode" placeholder="Ex: 1234">
      </div>

      <div class="form-group">
        <label>Région</label>
        <select class="select" id="createRegion">
          <option value="">Choisir une région</option>
          <option>Europe</option>
          <option>NA East</option>
          <option>NA West</option>
          <option>Brazil</option>
          <option>Asia</option>
          <option>Oceania</option>
        </select>
      </div>

      <div class="form-group">
        <label>Plateforme</label>
        <select class="select" id="createPlatform">
          <option value="">Choisir une plateforme</option>
          <option>PC</option>
          <option>Console</option>
          <option>Mobile</option>
          <option>Toutes</option>
        </select>
      </div>

      <div class="form-group full">
        <label>Arme Principal / Pompes</label>
        <select class="select" id="createWeapon">
          <option value="">Sélectionner les armes</option>
          <option>Pompe Spas 12 / AR Mythique</option>
          <option>Pompe Striker / AR Havoc</option>
          <option>Pompe Chasseur / AR Tac</option>
          <option>Loot Pool Compétitif Actuel</option>
          <option>Armes Bleues Uniquement</option>
        </select>
      </div>

      <div class="form-group full">
        <label>Team Size</label>
        <div class="segment four">
          <button class="active" onclick="setTeamSize(this,'1v1')">1v1</button>
          <button onclick="setTeamSize(this,'2v2')">2v2</button>
          <button onclick="setTeamSize(this,'3v3')">3v3</button>
          <button onclick="setTeamSize(this,'4v4')">4v4</button>
        </div>
      </div>

      <div class="form-group full">
        <label>Game Mode</label>
        <select class="select" id="createMode">
          <option value="">Choisir un Game Mode</option>
          <option>Box Fight</option>
          <option>Build Fight</option>
          <option>Zone Wars</option>
          <option>Realistic</option>
          <option>Kill Race</option>
          <option>Zero Build Realistic</option>
          <option>Zero Build Kill Race</option>
          <option>Zero Build Box Fight</option>
          <option>Piece Control</option>
          <option>Edit Wars</option>
        </select>
      </div>

      <div class="form-group full">
        <label>First To (Manches gagnantes)</label>
        <div class="segment five">
          <button class="active" onclick="setFirstTo(this,1)">1</button>
          <button onclick="setFirstTo(this,2)">2</button>
          <button onclick="setFirstTo(this,3)">3</button>
          <button onclick="setFirstTo(this,4)">4</button>
          <button onclick="setFirstTo(this,5)">5</button>
        </div>
      </div>

      <div class="form-group full">
        <div class="toggle-line">
          <div class="toggle-text">
            <strong>Kill Lead</strong>
            <span>Active cette option uniquement si le match utilise un avantage en kills.</span>
          </div>
          <button class="switch" id="killSwitch" onclick="toggleKillLead()"><span></span></button>
        </div>
      </div>

      <div class="form-group full kill-wrap" id="killWrap">
        <label>Nombre de Kill Lead</label>
        <div class="segment four">
          <button class="active" onclick="setKillLead(this,1)">1</button>
          <button onclick="setKillLead(this,2)">2</button>
          <button onclick="setKillLead(this,3)">3</button>
          <button onclick="setKillLead(this,4)">4</button>
        </div>
      </div>

      <div class="form-group full">
        <div class="toggle-line">
          <div class="toggle-text">
            <strong>Simple Edit</strong>
            <span>Active ou désactive le format Simple Edit.</span>
          </div>
          <button class="switch" id="simpleEditSwitch" onclick="toggleSimpleEdit()"><span></span></button>
        </div>
      </div>

    </div>
  </div>

  <div class="modal-footer">
    <button class="btn" onclick="closeCreateModal()">Annuler</button>
    <button class="btn green" onclick="createMatch()">Créer le match</button>
  </div>

</div>
</div>


<!-- =========================
     PASSCODE MODAL
========================= -->

<div class="overlay" id="passcodeOverlay">
<div class="modal" style="width:min(400px,100%);">
  <div class="modal-head">
    <h2>Match Privé</h2>
    <button class="close" onclick="closePasscodeModal()">×</button>
  </div>
  <div class="modal-body">
    <div class="form-group">
      <label>Entrez le code d'accès</label>
      <input type="password" class="input" id="joinPasscodeInput" placeholder="Code secret...">
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn" onclick="closePasscodeModal()">Annuler</button>
    <button class="btn green" onclick="confirmJoinPrivateMatch()">Valider</button>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>


<script>

/* STATE */
const STORAGE_KEY = "primeTokenV11";

let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || {
  username:"Player",
  epic:"",
  matches:[],
  currentLobby:null,
  chat:[],
  stats:{ played:0, wins:0, losses:0, streak:0 }
};

let currentPage = "home";
let createVisibility = "public";
let selectedTeamSize = "1v1";
let selectedFirstTo = 1;
let killLeadEnabled = false;
let selectedKillLead = 1;
let simpleEditEnabled = false;
let targetJoinMatchId = null;

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function escapeHTML(val){
  return String(val || "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function initials(name){
  if(!name) return "P";
  return name.trim().slice(0,2).toUpperCase();
}

function getWinRate(){
  if(!state.stats.played) return 0;
  return Math.round((state.stats.wins / state.stats.played) * 100);
}

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => el.classList.remove("show"), 2300);
}

function pageTitle(page){
  const titles = { home:"Accueil", matches:"Matchs", lobby:"Lobby", roue:"Roue", profile:"Profil", ranking:"Classement", tournaments:"Tournois", settings:"Paramètres" };
  return titles[page] || "Accueil";
}

function setPage(page){
  currentPage = page;
  document.querySelectorAll(".nav button").forEach(btn => btn.classList.toggle("active", btn.dataset.page === page));
  document.getElementById("pageName").textContent = pageTitle(page);
  render();
}

document.querySelectorAll(".nav button").forEach(btn => btn.addEventListener("click", () => setPage(btn.dataset.page)));

/* MODAL CONTROLS */
function openCreateModal(){ document.getElementById("createOverlay").classList.add("open"); }
function closeCreateModal(){ document.getElementById("createOverlay").classList.remove("open"); }

function setVisibility(v){
  createVisibility = v;
  document.getElementById("publicBtn").classList.toggle("active", v === "public");
  document.getElementById("privateBtn").classList.toggle("active", v === "private");
  document.getElementById("privateCodeWrap").classList.toggle("visible", v === "private");
}

function setTeamSize(btn, size){
  btn.parentElement.querySelectorAll("button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  selectedTeamSize = size;
}

function setFirstTo(btn, val){
  btn.parentElement.querySelectorAll("button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  selectedFirstTo = val;
}

function toggleKillLead(){
  killLeadEnabled = !killLeadEnabled;
  document.getElementById("killSwitch").classList.toggle("active", killLeadEnabled);
  document.getElementById("killWrap").classList.toggle("visible", killLeadEnabled);
}

function setKillLead(btn, val){
  btn.parentElement.querySelectorAll("button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  selectedKillLead = val;
}

function toggleSimpleEdit(){
  simpleEditEnabled = !simpleEditEnabled;
  document.getElementById("simpleEditSwitch").classList.toggle("active", simpleEditEnabled);
}

function createMatch(){
  const region = document.getElementById("createRegion").value;
  const platform = document.getElementById("createPlatform").value;
  const weapon = document.getElementById("createWeapon").value;
  const mode = document.getElementById("createMode").value;
  const passcode = document.getElementById("createMatchPasscode").value.trim();

  if(!region || !platform || !mode || !weapon){
    toast("Veuillez remplir tous les champs !");
    return;
  }

  if(createVisibility === "private" && !passcode){
    toast("Entrez un code pour le match privé !");
    return;
  }

  const newMatch = {
    id: "M-" + Math.floor(1000 + Math.random() * 9000),
    host: state.username,
    hostEpic: state.epic || "N/A",
    visibility: createVisibility,
    passcode: createVisibility === "private" ? passcode : null,
    region,
    platform,
    weapon,
    teamSize: selectedTeamSize,
    mode,
    firstTo: selectedFirstTo,
    killLead: killLeadEnabled ? selectedKillLead : null,
    simpleEdit: simpleEditEnabled,
    status: "OPEN",
    players: [state.username],
    readies: {},
    locked: false,
    completed: false
  };

  state.matches.unshift(newMatch);
  state.currentLobby = newMatch.id;
  save();
  closeCreateModal();
  toast("Match créé avec succès !");
  setPage("lobby");
}

/* CHAT */
function sendMessage(e){
  e.preventDefault();
  const input = document.getElementById("chatInput");
  const msg = input.value.trim();
  if(!msg) return;
  state.chat.push({ user: state.username, text: msg, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
  input.value = "";
  save();
  renderChat();
}

function renderChat(){
  const box = document.getElementById("chatMessages");
  if(!box) return;
  if(state.chat.length === 0){
    box.innerHTML = `<div style="color:var(--muted); font-size:10px; text-align:center; padding:20px;">Aucun message.</div>`;
    return;
  }
  box.innerHTML = state.chat.map(c => `
    <div class="chat-message">
      <div class="chat-avatar">${initials(c.user)}</div>
      <div class="chat-content">
        <div class="chat-meta"><strong>${escapeHTML(c.user)}</strong><span>${c.time}</span></div>
        <p>${escapeHTML(c.text)}</p>
      </div>
    </div>
  `).join("");
  box.scrollTop = box.scrollHeight;
}

/* RENDER */
function renderHeaderUI(){
  document.getElementById("miniAvatar").textContent = initials(state.username);
  document.getElementById("miniUsername").textContent = state.username;

  document.getElementById("topAvatar").textContent = initials(state.username);
  document.getElementById("topUsername").textContent = state.username;
  document.getElementById("topRecord").innerHTML =
    `<b>${state.stats.wins}V</b> · <i>${state.stats.losses}D</i> · ${getWinRate()}%`;
}

function render(){
  renderHeaderUI();
  const container = document.getElementById("content");

  if(currentPage === "home"){
    container.innerHTML = `
      <div class="hero">
        <div class="hero-grid"></div>
        <div class="hero-content">
          <div class="eyebrow"><i></i> Plateforme Compétitive Fortnite</div>
          <h1>AFFRONTE LES MEILLEURS <span>EN 1V1</span></h1>
          <p>Rejoins des matchs en temps réel, grimpe dans le classement et prouve ton niveau.</p>
          <div class="hero-actions">
            <button class="btn green" onclick="openCreateModal()">Créer un match</button>
            <button class="btn" onclick="setPage('matches')">Voir les matchs</button>
          </div>
        </div>
        <div class="hero-side">
          <div class="hero-card">
            <div class="hero-card-label">Statistiques Joueur</div>
            <div class="hero-card-value">${getWinRate()}% <span>Winrate</span></div>
            <div class="hero-card-row"><span>Matchs joués</span><strong>${state.stats.played}</strong></div>
            <div class="hero-card-row"><span>Victoires</span><strong>${state.stats.wins}</strong></div>
            <div class="hero-card-row"><span>Défaites</span><strong>${state.stats.losses}</strong></div>
          </div>
        </div>
      </div>

      <div class="home-grid">
        <div class="panel">
          <div class="panel-head"><h3>Statistiques</h3><span>PERFORMANCES</span></div>
          <div class="panel-body">
            <div class="quick-stats">
              <div class="quick-stat"><span>Joués</span><strong>${state.stats.played}</strong></div>
              <div class="quick-stat"><span>Victoires</span><strong>${state.stats.wins}</strong></div>
              <div class="quick-stat"><span>Défaites</span><strong>${state.stats.losses}</strong></div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head"><h3>Chat Général</h3><span>EN DIRECT</span></div>
          <div class="panel-body" style="padding:0;">
            <div class="chat-box">
              <div class="chat-messages" id="chatMessages"></div>
              <form class="chat-form" onsubmit="sendMessage(event)">
                <input type="text" id="chatInput" placeholder="Écris un message..." autocomplete="off">
                <button type="submit" class="btn green small">Envois</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    `;
    renderChat();
  }

  else if(currentPage === "matches"){
    const openMatches = state.matches.filter(m => m.status === "OPEN" && !m.completed);
    container.innerHTML = `
      <div class="matches-header">
        <div><h1>Matchs Disponibles</h1><p>Rejoins une partie en attente d'adversaire.</p></div>
      </div>
      <div class="matches-list">
        ${openMatches.length === 0 ? `
          <div class="empty" style="grid-column: 1/-1;">
            <strong>Aucun match disponible pour le moment</strong>
            <span>Sois le premier à en créer un !</span>
          </div>
        ` : openMatches.map(m => `
          <div class="match-card">
            <div class="match-top">
              <div class="match-game">
                <div class="game-icon">FN</div>
                <div>
                  <strong>${escapeHTML(m.mode)}${m.visibility === "private" ? "🔒 (Privé)" : ""}</strong>
                  <span>Hôte en attente</span>
                </div>
              </div>
              <span class="status ${m.visibility === "private" ? "private" : "open"}">${m.visibility === "private" ? "PRIVÉ" : "OUVERT"}</span>
            </div>
            <div class="match-body">
              <div class="match-info"><span>Format</span><strong>${m.teamSize}</strong></div>
              <div class="match-info"><span>First To</span><strong>${m.firstTo}</strong></div>
              <div class="match-info"><span>Région</span><strong>${escapeHTML(m.region)}</strong></div>
              <div class="match-info"><span>Armes</span><strong>${escapeHTML(m.weapon)}</strong></div>
            </div>
            <div class="match-footer">
              <small>ID: ${m.id}</small>${m.host === state.username ? `<span style="font-size:10px; color:var(--muted);">Ton Match</span>` : `<button class="btn green small" onclick="joinMatch('${m.id}')">Rejoindre</button>`}
            </div>
          </div>
        `).join("")}
      </div>
    `;
  }

  else if(currentPage === "lobby"){
    const lobby = state.matches.find(m => m.id === state.currentLobby);

    if(!lobby){
      container.innerHTML = `<div class="empty"><strong>Aucun lobby actif</strong><span>Rejoins ou crée un match.</span></div>`;
      return;
    }

    const isHost = (lobby.host === state.username);
    const hasOpponent = (lobby.players.length > 1);
    const opponentName = hasOpponent ? lobby.players.find(p => p !== state.username) : null;
    
    const userReady = lobby.readies && lobby.readies[state.username];
    const bothReady = hasOpponent && lobby.readies && Object.keys(lobby.readies).length >= 2 && Object.values(lobby.readies).every(Boolean);

    container.innerHTML = `
      <div class="lobby-layout">
        <div class="lobby-main">
          <div class="lobby-header">
            <div class="lobby-title">
              <strong>Lobby Match — ${escapeHTML(lobby.mode)} (${lobby.teamSize})</strong>
              <span>${lobby.locked ? "PARTIE EN COURS — VERROUILLÉE" : "Match Anonyme"}</span>
            </div>
            <div class="lobby-code">
              <span>CODE DU MATCH</span>
              <strong>${lobby.id}</strong>
            </div>
          </div>

          <div class="teams">
            <div class="team">
              <div class="team-head">Joueur 1</div>
              <div class="team-slots">
                <div class="slot">
                  <div class="avatar">${(isHost || bothReady) ? initials(lobby.host) : "?"}</div>
                  <div>
                    <div class="slot-name">${(isHost || bothReady) ? escapeHTML(lobby.host) : "Joueur 1 (Masqué)"}</div>
                    <div class="slot-epic">${(isHost || bothReady) ? "Epic: " + escapeHTML(lobby.hostEpic || "Non renseigné") : "Identité masquée jusqu'à ce que les deux joueurs soient prêts"}</div>
                  </div>
                </div>
              </div>
            </div>

            <div class="team">
              <div class="team-head">Joueur 2</div>
              <div class="team-slots">
                ${hasOpponent ? `
                  <div class="slot">
                    <div class="avatar">${(!isHost || bothReady) ? initials(opponentName) : "?"}</div>
                    <div>
                      <div class="slot-name">${(!isHost || bothReady) ? escapeHTML(opponentName) : "Adversaire Connecté (Masqué)"}</div>
                      <div class="slot-epic">${(!isHost || bothReady) ? "Epic: " + escapeHTML(lobby.opponentEpic || "Non renseigné") : "Identité masquée jusqu'à ce que les deux joueurs soient prêts"}</div>
                    </div>
                  </div>
                ` : `
                  <div class="slot empty-slot">En attente d'un adversaire...</div>
                `}
              </div>
            </div>
          </div>

          ${hasOpponent && !bothReady ? `
            <div style="padding:12px 15px; border:1px dashed var(--line); background:rgba(255,255,255,.02); font-size:10px; color:var(--muted); margin-top:10px;">
              🔒 Les identités (pseudo + Epic Games) restent masquées tant que les deux joueurs n'ont pas appuyé sur « Je suis prêt ! ».
            </div>
          ` : ''}

          ${bothReady ? `
            <div style="padding:12px 15px; border:1px solid rgba(0,255,136,.25); background:rgba(0,255,136,.06); font-size:10px; color:var(--green); margin-top:10px;">
              ✅ Identités révélées — vous pouvez maintenant vous retrouver en jeu.
            </div>
          ` : ''}

          <!-- SECTION RESULTATS EN FIN DE MATCH -->
          ${lobby.locked ? `
            <div style="padding:20px; background:rgba(0,255,136,.05); border-top:1px solid var(--line); text-align:center;">
              <h3 style="color:#fff; margin-bottom:10px;">Partie Verrouillée — Saisir le résultat</h3>
              <p style="color:var(--muted); font-size:11px; margin-bottom:15px;">Une fois le match terminé sur Fortnite, indique le résultat ci-dessous.</p>
              <div style="display:flex; justify-content:center; gap:15px;">
                <button class="btn green" onclick="claimResult('${lobby.id}', 'WIN')">🏆 J'ai Gagné (Victoire)</button>
                <button class="btn danger" onclick="claimResult('${lobby.id}', 'LOSS')">❌ J'ai Perdu (Défaite)</button>
              </div>
            </div>
          ` : ''}

          <div class="lobby-actions">
            ${!lobby.locked ? `
              <button class="btn danger" onclick="leaveLobby()">Quitter le lobby</button>
            ` : `
              <span style="font-size:10px; color:var(--red); font-weight:bold;">IMPOSSIBLE DE QUITTER (MATCH EN COURS)</span>
            `}

            <div style="display:flex; gap:10px;">
              ${(!hasOpponent && isHost) ? `
                <button class="btn" onclick="simulateOpponent('${lobby.id}')">🤖 Simuler un adversaire</button>
              ` : ''}

              ${(hasOpponent && !lobby.locked) ? `
                <button class="btn ${userReady ? 'danger' : 'green'}" onclick="toggleReady('${lobby.id}')">
                  ${userReady ? 'Annuler Prêt' : 'Je suis prêt !'}
                </button>
              ` : ''}
            </div>
          </div>

        </div>
      </div>
    `;
  }

  else if(currentPage === "roue"){
    container.innerHTML = `
      <div class="empty">
        <strong style="font-size:24px;">🎡 La Roue Prime Token</strong>
        <span>Onglet actuellement en construction. Bientôt disponible !</span>
      </div>
    `;
  }

  else if(currentPage === "profile"){
    container.innerHTML = `
      <div class="profile-grid">
        <div class="profile-card">
          <div class="profile-main">
            <div class="profile-big-avatar">${initials(state.username)}</div>
            <div>
              <strong>${escapeHTML(state.username)}</strong>
              <span>Epic Games: ${escapeHTML(state.epic || "Non relié")}</span>
            </div>
          </div>
          <div class="profile-stats">
            <div class="profile-stat"><span>Matchs Joués</span><strong>${state.stats.played}</strong></div>
            <div class="profile-stat"><span>Victoires</span><strong>${state.stats.wins}</strong></div>
            <div class="profile-stat"><span>Défaites</span><strong>${state.stats.losses}</strong></div>
          </div>
        </div>
      </div>
    `;
  }

  else if(currentPage === "ranking"){
    container.innerHTML = `
      <div class="ranking-table">
        <div class="ranking-row head"><span>#</span><span>Joueur</span><span>Victoires</span><span>Winrate</span></div>
        <div class="ranking-row">
          <strong>1</strong>
          <span>${escapeHTML(state.username)} (Toi)</span>
          <strong>${state.stats.wins}</strong>
          <strong>${getWinRate()}%</strong>
        </div>
      </div>
    `;
  }

  else if(currentPage === "settings"){
    container.innerHTML = `
      <div class="settings-grid">
        <div class="setting-card" style="padding:20px;">
          <h3 style="margin-bottom:15px; font-size:14px;">Paramètres du Profil</h3>
          <div class="form-group" style="margin-bottom:12px;">
            <label>Nom d'utilisateur</label>
            <input type="text" class="input" id="settingUsername" value="${escapeHTML(state.username)}">
          </div>
          <div class="form-group" style="margin-bottom:15px;">
            <label>Pseudo Epic Games</label>
            <input type="text" class="input" id="settingEpic" value="${escapeHTML(state.epic)}" placeholder="Ton Pseudo Epic">
          </div>
          <button class="btn green" onclick="saveSettings()">Sauvegarder</button>
        </div>
      </div>
    `;
  }

  else {
    container.innerHTML = `<div class="empty"><strong>Page en construction</strong></div>`;
  }
}

/* ACTIONS */
function joinMatch(id){
  const match = state.matches.find(m => m.id === id);
  if(!match) return;
  if(match.host === state.username){ toast("Tu es l'hôte de ce match !"); return; }
  if(match.players.length >= 2){ toast("Match complet !"); return; }

  if(match.visibility === "private"){
    targetJoinMatchId = id;
    document.getElementById("joinPasscodeInput").value = "";
    document.getElementById("passcodeOverlay").classList.add("open");
    return;
  }
  executeJoin(match);
}

function closePasscodeModal(){
  document.getElementById("passcodeOverlay").classList.remove("open");
  targetJoinMatchId = null;
}

function confirmJoinPrivateMatch(){
  const match = state.matches.find(m => m.id === targetJoinMatchId);
  const code = document.getElementById("joinPasscodeInput").value.trim();
  if(!match) return;
  if(code !== match.passcode){ toast("Code incorrect !"); return; }
  closePasscodeModal();
  executeJoin(match);
}

function executeJoin(match){
  match.players.push(state.username);
  match.opponentEpic = state.epic || "N/A";
  state.currentLobby = match.id;
  save();
  toast("Tu as rejoint le match ! Identité masquée jusqu'à ce que vous soyez prêts.");
  setPage("lobby");
}

function simulateOpponent(matchId){
  const match = state.matches.find(m => m.id === matchId);
  if(!match) return;
  match.players.push("Bot_Opponent");
  match.opponentEpic = "BotOpponent_2024";
  match.readies["Bot_Opponent"] = true;
  save();
  toast("Un adversaire a rejoint le match ! Identité masquée pour l'instant.");
  render();
}

function toggleReady(matchId){
  const match = state.matches.find(m => m.id === matchId);
  if(!match) return;
  if(!match.readies) match.readies = {};

  const wasBothReady = Object.keys(match.readies).length >= 2 && Object.values(match.readies).every(Boolean);

  match.readies[state.username] = !match.readies[state.username];

  const isBothReadyNow = Object.keys(match.readies).length >= 2 && Object.values(match.readies).every(Boolean);

  if(isBothReadyNow && !wasBothReady){
    match.locked = true;
    toast("Les 2 joueurs sont prêts ! Identités révélées — le match est VERROUILLÉ.");
  }

  save();
  render();
}

function claimResult(matchId, type){
  const match = state.matches.find(m => m.id === matchId);
  if(!match) return;

  state.stats.played += 1;
  if(type === 'WIN'){
    state.stats.wins += 1;
    toast("Victoire enregistrée ! +1 Win");
  } else {
    state.stats.losses += 1;
    toast("Défaite enregistrée.");
  }

  match.completed = true;
  state.currentLobby = null;
  save();
  setPage("matches");
}

function leaveLobby(){
  const lobby = state.matches.find(m => m.id === state.currentLobby);
  if(lobby && lobby.locked){
    toast("Impossible de quitter un match en cours !");
    return;
  }
  state.currentLobby = null;
  save();
  toast("Lobby quitté.");
  setPage("matches");
}

function saveSettings(){
  const u = document.getElementById("settingUsername").value.trim();
  const e = document.getElementById("settingEpic").value.trim();
  if(!u){ toast("Nom d'utilisateur requis !"); return; }
  state.username = u;
  state.epic = e;
  save();
  toast("Sauvegardé !");
  render();
}

render();

</script>
</body>
</html>
